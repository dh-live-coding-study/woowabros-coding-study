<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><title>코딩 스터디 제출 수집</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#24292f;line-height:1.6}label{display:block;margin:16px 0}input:not([type=checkbox]){display:block;width:100%;box-sizing:border-box;padding:9px;border:1px solid #aaa;border-radius:5px}button{padding:8px 14px;cursor:pointer}li{margin:14px 0}small{display:block;color:#57606a}#message{white-space:pre-wrap}a{color:#0969da}
</style>
</head>
<body>
<h1>제출 수집 설정</h1>
<p><a href="https://github.com/dh-live-coding-study/woowabros-coding-study/blob/main/study.config.json" target="_blank" rel="noreferrer">study.config.json</a>에서 본인의 참여자 ID와 사이트 계정을 확인하세요.</p>
<form id="settings">
<label>GitHub 저장소<input name="repository" value="dh-live-coding-study/woowabros-coding-study" required></label>
<label>참여자 ID<input name="member" placeholder="hyoyoon" required></label>
<label>백준 아이디<input name="baekjoon"><small>백준을 수집하려면 로그인한 아이디와 같아야 합니다.</small></label>
<label>프로그래머스 계정 표시<input name="programmers"><small>로그인 계정을 자동 확인할 수 없어 직접 입력한 값을 사용합니다. 설정 파일과 똑같이 입력하세요.</small></label>
<label>GitHub 토큰<input name="token" type="password" autocomplete="off" required><small>이 저장소의 Actions: Read and write, Contents: Read-only, Pull requests: Read-only 권한이 필요합니다.</small></label>
<label><input name="enabled" type="checkbox"> 제출 수집 켜기</label>
<button type="submit">저장</button>
</form>
<p id="message" role="status"></p>
<h2>대기 중인 제출</h2>
<p>원문이 PR에 저장됐는지 확인한 뒤 대기 목록에서 정리합니다.</p>
<button id="refresh">새로 고침</button> <button id="export">대기 원문 저장</button>
<ul id="queue"></ul>
<h2>등록한 제출</h2>
<ul id="history"></ul>
<script type="module" src="options.mjs"></script>
</body>
</html>
